name: Deploy Supabase Functions

on:
  workflow_dispatch:
    inputs:
      functions:
        description: 'Function names to deploy, space-separated (e.g. "platform-guide-assistant team-task-email")'
        required: true
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pinned: "latest" broke deploys when a new CLI started asking for confirmation.
          version: 3.1.0

      - name: Work out which functions to deploy
        id: pick
        env:
          INPUT_FUNCTIONS: ${{ github.event.inputs.functions }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID || 'esifpjjehdnpkhyilctv' }}
        run: |
          fns=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            fns="$INPUT_FUNCTIONS"
          else
            changed=$(git diff --name-only "$BEFORE" "$AFTER" -- supabase/functions)
            if echo "$changed" | grep -q '^supabase/functions/_shared/'; then
              # Shared code changed: redeploy functions that import it AND are already live,
              # so unused functions never get published by accident.
              live=$(supabase functions list --project-ref "$PROJECT_ID" -o json | jq -r 'if type=="array" then . else .functions end | .[].slug')
              importers=$(grep -rl "_shared/" supabase/functions --include='*.ts' | cut -d/ -f3 | grep -v '^_shared$' | sort -u)
              fns=$(comm -12 <(echo "$importers") <(echo "$live" | sort -u))
            fi
            fns="$fns $(echo "$changed" | cut -d/ -f3 | { grep -v '^_shared$' || true; } | sort -u)"
          fi
          # Only deploy folders that still exist (deleted functions are skipped).
          out=""
          for fn in $fns; do
            [ -f "supabase/functions/$fn/index.ts" ] && out="$out $fn"
          done
          out=$(echo $out | tr ' ' '\n' | sort -u | tr '\n' ' ')
          echo "Functions to deploy: ${out:-none}"
          echo "list=$out" >> "$GITHUB_OUTPUT"

      - name: Deploy Edge Functions
        if: steps.pick.outputs.list != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID || 'esifpjjehdnpkhyilctv' }}
        run: |
          # verify_jwt comes from supabase/config.toml per function (no global override).
          for fn in ${{ steps.pick.outputs.list }}; do
            echo "Deploying function: $fn"
            supabase functions deploy "$fn" --remote="$PROJECT_ID" --use-api --yes
          done
